name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  seseragi-web:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM: kentaromorishitas-projects

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Seseragi CLI
        run: cargo install --git https://github.com/KentaroMorishita/seseragi --branch fix/float-arithmetic-operators --locked seseragi-cli

      - name: Build web app
        run: |
          seseragi build .
          test -f dist/index.html

      - name: Reject unresolved generated expressions
        run: |
          if grep -R -n -E '=>[[:space:]]*_;' dist; then
            echo "Generated bundle contains an unresolved Seseragi lowering placeholder."
            exit 1
          fi

      - name: Deploy to Vercel
        if: github.event_name != 'pull_request' && env.VERCEL_TOKEN != ''
        run: |
          bunx vercel@latest project inspect seseragi-calculator \
            --scope "$VERCEL_TEAM" \
            --token "$VERCEL_TOKEN" >/dev/null 2>&1 \
            || bunx vercel@latest project add seseragi-calculator \
              --scope "$VERCEL_TEAM" \
              --token "$VERCEL_TOKEN"

          bunx vercel@latest deploy dist \
            --prod \
            --yes \
            --project seseragi-calculator \
            --scope "$VERCEL_TEAM" \
            --token "$VERCEL_TOKEN"

      - name: Vercel deployment is not configured
        if: github.event_name != 'pull_request' && env.VERCEL_TOKEN == ''
        run: echo "Set the VERCEL_TOKEN repository secret to enable production deployment."
